name: Crates

on:
  push:
    branches: [main, staging, next]
  pull_request:
  workflow_dispatch:

# Each job states the permissions that it needs.
permissions: {}

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Crates Tests
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      RISC0_SKIP_BUILD_KERNELS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show Rust version
        run: rustc --version

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Foundry version
        run: forge --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run rustfmt
        run: just crates-fmt-check

      - name: Build
        run: just crates-build

      - name: Lint
        run: just crates-lint

      # The deployment promotion gate runs on pull requests into an environment branch, where the recorded
      # deployments and the source are meant to agree. Elsewhere the gated tests skip and no chain is forked.
      - name: Run Tests
        run: just crates-test
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          VERIFY_STAGING_DEPLOYMENTS: ${{ github.base_ref == 'staging' }}
          VERIFY_PRODUCTION_DEPLOYMENTS: ${{ github.base_ref == 'main' }}

      # Pull requests into `staging` and `main` test the staging deployment on a Sepolia fork until production records a
      # deployment. The queue the secrets name must prove this resource machine version.
      - name: Run e2e Tests
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        run: just crates-test-e2e
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          QUEUE_BASE_URL: ${{ secrets.QUEUE_BASE_URL }}
          QUEUE_AUTH_TOKEN: ${{ secrets.QUEUE_AUTH_TOKEN }}
