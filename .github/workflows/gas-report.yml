name: Gas Report

on:
  push:
    branches: [main, staging, next]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to compare (open, closed, or merged)
        required: false
        type: string

concurrency:
  group: gas-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  clear-labels:
    name: Clear previous gas labels
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gas-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Clear managed labels for this comparison
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ $(jq -r '.head.sha' <<< "$pr") == "$HEAD_SHA" &&
             $(jq -r '.base.sha' <<< "$pr") == "$BASE_SHA" &&
             $(jq -r '.state' <<< "$pr") == open ]] || exit 0
          while IFS= read -r label; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${label}"
          done < <(jq -r '.labels[].name | select(. == "gas:measured-improvement" or . == "gas:mixed") | @uri' <<< "$pr")

  gas-report:
    name: Gas Report
    outputs:
      gas-label: ${{ steps.operations.outputs.label }}
    runs-on: macos-latest
    env:
      FOUNDRY_PROFILE: ci
      GAS_TEST_CONTRACTS: Benchmark|ProtocolAdapterMockVerifierTest|ProtocolAdapter(Denylist|Policy)Test|LogicRef(Denylist|PolicyRegistry)Test|NullifierSetTest|CommitmentTreeTest
      REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Resolve comparison revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number" >&2; exit 1; }
            IFS=$'\t' read -r head base target < <(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                --jq '[.head.sha, .base.sha, .base.ref] | @tsv'
            )
            [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ && -n "$target" ]]
            {
              echo "compare=true"
              echo "head=$head"
              echo "base=$base"
            } >> "$GITHUB_OUTPUT"
            {
              echo "REPORT_SHA=$head"
              echo "BASE_SHA=$base"
              echo "BASE_REF=$target"
            } >> "$GITHUB_ENV"
          else
            {
              echo "compare=false"
              echo "head=$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revisions.outputs.head }}
          persist-credentials: false

      - name: Check gas label classification
        if: hashFiles('.github/tests/gas-labels.sh') != ''
        run: bash .github/tests/gas-labels.sh

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: just contracts-deps

      - name: Generate gas snapshot
        working-directory: contracts
        run: |
          forge snapshot --match-contract "$GAS_TEST_CONTRACTS" --fuzz-seed 0x1
          test -s .gas-snapshot
          # Table-driven tests report mean gas; normalize those entries for comparison.
          sed -E 's/\(runs: [0-9]+, μ: ([0-9]+), ~: [0-9]+\)/(gas: \1)/' .gas-snapshot > .gas-snapshot-report
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Generate gas report
        working-directory: contracts
        run: forge test --gas-report --match-contract "$GAS_TEST_CONTRACTS" --fuzz-seed 0x1 > gas-report.txt
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Generate contract sizes
        working-directory: contracts
        run: forge build --sizes > contract-sizes.txt 2>&1

      - name: Measure head operations
        working-directory: contracts
        run: |
          rm -rf gas-operation-snapshots
          if [[ -d test/gas ]]; then
            forge test --match-path 'test/gas/**/*.t.sol' --fuzz-seed 0x1 --isolate --gas-snapshot-emit true
          fi
        env:
          FOUNDRY_SNAPSHOTS: gas-operation-snapshots

      - name: Checkout PR base
        if: steps.revisions.outputs.compare == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revisions.outputs.base }}
          path: gas-baseline
          persist-credentials: false

      - name: Install baseline dependencies
        if: steps.revisions.outputs.compare == 'true'
        working-directory: gas-baseline
        run: just contracts-deps

      - name: Generate baseline gas snapshot
        if: steps.revisions.outputs.compare == 'true'
        working-directory: gas-baseline/contracts
        run: |
          forge snapshot --match-contract "$GAS_TEST_CONTRACTS" --fuzz-seed 0x1
          test -s .gas-snapshot
          sed -E 's/\(runs: [0-9]+, μ: ([0-9]+), ~: [0-9]+\)/(gas: \1)/' .gas-snapshot > ../../contracts/.gas-snapshot-base
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      - name: Measure baseline operations
        if: steps.revisions.outputs.compare == 'true'
        run: |
          rm -rf gas-baseline/contracts/gas-operation-snapshots
          if [[ -d contracts/test/gas ]]; then
            # Run the same operation fixtures on both revisions.
            rm -rf gas-baseline/contracts/test/gas
            cp -R contracts/test/gas gas-baseline/contracts/test/gas
            cd gas-baseline/contracts
            forge test --match-path 'test/gas/**/*.t.sol' --fuzz-seed 0x1 --isolate --gas-snapshot-emit true
          fi
        env:
          FOUNDRY_SNAPSHOTS: gas-operation-snapshots

      - name: Compare operation gas
        id: operations
        if: steps.revisions.outputs.compare == 'true'
        run: |
          set -euo pipefail
          read_snapshots() {
            local directory=$1 snapshot group
            for snapshot in "$directory"/*.json; do
              [[ -f "$snapshot" ]] || continue
              group=$(basename "$snapshot" .json)
              jq -e 'type == "object" and length > 0
                and all(.[]; tonumber > 0 and tonumber <= 9007199254740991
                and (tonumber | floor) == tonumber)' "$snapshot" > /dev/null || return 1
              jq --arg group "$group" 'to_entries
                | map({key: ($group + "/" + .key), value: (.value | tonumber)})
                | from_entries' "$snapshot" || return 1
            done
          }
          base=$(read_snapshots gas-baseline/contracts/gas-operation-snapshots | jq -s 'add // {}')
          head=$(read_snapshots contracts/gas-operation-snapshots | jq -s 'add // {}')
          comparison=$(jq -n --argjson base "$base" --argjson head "$head" '
            ($base | keys) as $keys
            | [$keys[] as $name | select($head | has($name))
                | {name: $name, before: $base[$name], after: $head[$name],
                   delta: ($head[$name] - $base[$name])}] as $rows
            | ($keys == ($head | keys) and ($keys | length) > 0) as $complete
            | {rows: $rows, complete: $complete,
                label: (if $complete and any($rows[]; .delta < 0) then
                  if any($rows[]; .delta > 0) then "gas:mixed"
                  else "gas:measured-improvement" end
                else "" end)}')
          {
            echo "### Operation gas"
            echo ""
            echo "Identical operation fixtures on both revisions; isolated gas measurements exclude test setup and assertions. Labels describe these measurements only, not total transaction costs."
            echo ""
            echo "| Operation | ${BASE_REF} | PR | Δ | % |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            while IFS=$'\t' read -r name before after delta; do
              pct=$(awk -v delta="$delta" -v base="$before" 'BEGIN { printf "%+.2f", delta / base * 100 }')
              # shellcheck disable=SC2016
              printf '| `%s` | %d | %d | %+d | %s%% |\n' "$name" "$before" "$after" "$delta" "$pct"
            done < <(jq -r '.rows[] | [.name, .before, .after, .delta] | @tsv' <<< "$comparison")
            if [[ $(jq -r '.complete' <<< "$comparison") != true ]]; then
              echo ""
              echo "No complete matching set of operation measurements; gas labels are withheld."
            fi
          } > contracts/operation-gas.md
          echo "label=$(jq -r '.label' <<< "$comparison")" >> "$GITHUB_OUTPUT"

      - name: Generate gas diff
        if: steps.revisions.outputs.compare == 'true'
        working-directory: contracts
        run: |
          # shellcheck disable=SC2001
          total_base=0
          total_pr=0

          # Build a diff table comparing base vs PR gas values
          {
            echo "| Test | ${BASE_REF} | PR | Δ | % |"
            echo "|------|-----:|---:|--:|--:|"
            while IFS= read -r line || [[ -n "$line" ]]; do
              # shellcheck disable=SC2001
              name=$(echo "$line" | sed 's/ *(gas:.*//')
              # shellcheck disable=SC2001
              pr_gas=$(echo "$line" | sed 's/.*(gas: \([0-9]*\))/\1/')
              # Look up the same test in the baseline
              base_line=$(grep -F -- "${name} (gas:" .gas-snapshot-base 2>/dev/null || true)
              if [[ -z "$base_line" ]]; then
                pr_fmt=$(printf "%'d" "$pr_gas" 2>/dev/null || echo "$pr_gas")
                echo "| \`${name}\` | — | ${pr_fmt} | *new* | |"
                continue
              fi
              # shellcheck disable=SC2001
              base_gas=$(echo "$base_line" | sed 's/.*(gas: \([0-9]*\))/\1/')
              total_base=$((total_base + base_gas))
              total_pr=$((total_pr + pr_gas))
              delta=$((pr_gas - base_gas))
              if (( base_gas != 0 )); then
                pct=$(awk "BEGIN { printf \"%.2f\", ($delta / $base_gas) * 100 }")
              else
                pct="—"
              fi
              base_fmt=$(printf "%'d" "$base_gas" 2>/dev/null || echo "$base_gas")
              pr_fmt=$(printf "%'d" "$pr_gas" 2>/dev/null || echo "$pr_gas")
              delta_fmt=$(printf "%'+d" "$delta" 2>/dev/null || echo "$delta")
              icon=""
              if (( delta > 0 )); then
                icon=" :small_red_triangle:"
              elif (( delta < 0 )); then
                icon=" :small_red_triangle_down:"
              fi
              echo "| \`${name}\` | ${base_fmt} | ${pr_fmt} | ${delta_fmt}${icon} | ${pct}% |"
            done < .gas-snapshot-report
          } > gas-diff.txt

          # Write summary with totals
          total_delta=$((total_pr - total_base))
          if (( total_base != 0 )); then
            total_pct=$(awk "BEGIN { printf \"%.2f\", ($total_delta / $total_base) * 100 }")
          else
            total_pct="—"
          fi
          total_base_fmt=$(printf "%'d" "$total_base" 2>/dev/null || echo "$total_base")
          total_pr_fmt=$(printf "%'d" "$total_pr" 2>/dev/null || echo "$total_pr")
          total_delta_fmt=$(printf "%'+d" "$total_delta" 2>/dev/null || echo "$total_delta")
          icon=""
          if (( total_delta > 0 )); then
            icon=":small_red_triangle:"
          elif (( total_delta < 0 )); then
            icon=":small_red_triangle_down:"
          fi
          echo "${total_base_fmt}|${total_pr_fmt}|${total_delta_fmt}|${total_pct}|${icon}" > gas-summary.txt

      - name: Sanitize ref name
        id: ref
        run: echo "slug=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload gas artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report-${{ steps.ref.outputs.slug }}-${{ github.sha }}
          path: |
            contracts/.gas-snapshot
            contracts/.gas-snapshot-base
            contracts/.gas-snapshot-report
            contracts/gas-diff.txt
            contracts/gas-summary.txt
            contracts/gas-report.txt
            contracts/contract-sizes.txt
            contracts/gas-operation-snapshots/*.json
            gas-baseline/contracts/gas-operation-snapshots/*.json
            contracts/operation-gas.md
          include-hidden-files: true
          retention-days: 30

      - name: Build gas report comment
        if: steps.revisions.outputs.compare == 'true'
        working-directory: contracts
        run: |
          # shellcheck disable=SC2001
          {
            echo "### Gas Report"
            echo "Base: \`${BASE_REF}\` at \`${BASE_SHA}\`."
            echo "Snapshots cover adapter execution, logic-reference restrictions, nullifiers, roots, and Merkle-tree benchmarks. Table-driven and fuzz entries use mean gas; totals are test gas, including test setup, rather than transaction costs."

            echo ""
            cat operation-gas.md

            # --- Summary (visible) ---
            IFS='|' read -r s_base s_pr s_delta s_pct s_icon < gas-summary.txt
            echo ""
            echo "| | ${BASE_REF} | PR | Δ | % |"
            echo "|:--|-----:|---:|--:|--:|"
            echo "| **Total matched test gas** | ${s_base} | ${s_pr} | ${s_delta} ${s_icon} | **${s_pct}%** |"

            # --- Gas Diff (if baseline exists) ---
            if [[ -f gas-diff.txt ]]; then
              echo ""
              echo "<details>"
              echo "<summary><b>Gas Diff vs. ${BASE_REF}</b> &mdash; per-test breakdown</summary>"
              echo ""
              cat gas-diff.txt
              echo ""
              echo "</details>"
            fi

            # --- Gas Snapshot ---
            echo ""
            echo "<details>"
            echo "<summary><b>Gas Snapshot</b> &mdash; per-test gas consumption</summary>"
            echo ""
            echo "| Test | Gas |"
            echo "|------|----:|"
            while IFS= read -r line || [[ -n "$line" ]]; do
              # shellcheck disable=SC2001
              name=$(echo "$line" | sed 's/ *(gas:.*//')
              gas=$(echo "$line"  | sed 's/.*(gas: \([0-9]*\))/\1/')
              gas_fmt=$(printf "%'d" "$gas" 2>/dev/null || echo "$gas")
              echo "| \`${name}\` | ${gas_fmt} |"
            done < .gas-snapshot-report
            echo ""
            echo "</details>"

            # --- Gas Report ---
            echo ""
            echo "<details>"
            echo "<summary><b>Gas Report</b> &mdash; per-function statistics</summary>"
            echo ""
            echo '```'
            sed -n '/╭/,/╯/p' gas-report.txt
            echo '```'
            echo ""
            echo "</details>"

            # --- Contract Sizes ---
            echo ""
            echo "<details>"
            echo "<summary><b>Contract Sizes</b> &mdash; EVM bytecode size (24,576 B limit)</summary>"
            echo ""
            echo "| Contract | Runtime (B) | Initcode (B) | Margin (B) |"
            echo "|----------|------------:|--------------:|-----------:|"
            while IFS='|' read -r _ name runtime initcode margin _initmargin _; do
              name=$(echo "$name" | xargs)
              runtime=$(echo "$runtime" | xargs | tr -d ',')
              initcode=$(echo "$initcode" | xargs | tr -d ',')
              margin=$(echo "$margin" | xargs | tr -d ',')
              [[ -z "$name" || "$name" == *"Contract"* || "$name" == *"---"* || "$name" == *"==="* ]] && continue
              [[ "$runtime" =~ ^[0-9]+$ ]] || continue
              (( runtime <= 100 )) && continue
              [[ "$name" =~ (Mock|Test|Example|Fuzzing|^std) ]] && continue
              runtime_fmt=$(printf "%'d" "$runtime" 2>/dev/null || echo "$runtime")
              initcode_fmt=$(printf "%'d" "$initcode" 2>/dev/null || echo "$initcode")
              margin_fmt=$(printf "%'d" "$margin" 2>/dev/null || echo "$margin")
              warn=""
              (( margin < 2048 )) && warn=" :warning:"
              echo "| \`${name}\` | ${runtime_fmt} | ${initcode_fmt} | ${margin_fmt}${warn} |"
            done < contract-sizes.txt
            echo ""
            echo "</details>"

            # --- Footer ---
            echo ""
            echo "---"
            echo "<sub>Generated by CI &mdash; commit \`${REPORT_SHA::7}\` &mdash; $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > /tmp/gas-comment.md
          cat /tmp/gas-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR comment
        if: steps.revisions.outputs.compare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gas-report-comment
          path: /tmp/gas-comment.md
          retention-days: 1

  comment:
    name: Publish Gas Report
    concurrency:
      group: gas-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    needs: [gas-report, clear-labels]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download PR comment
        uses: actions/download-artifact@v4
        with:
          name: gas-report-comment

      - name: Reconcile gas labels for current revisions
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GAS_LABEL: ${{ needs.gas-report.outputs.gas-label }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          [[ $(jq -r '.head.sha' <<< "$pr") == "$HEAD_SHA" &&
             $(jq -r '.base.sha' <<< "$pr") == "$BASE_SHA" &&
             $(jq -r '.state' <<< "$pr") == open ]] || exit 0
          case "$GAS_LABEL" in
            ""|gas:measured-improvement|gas:mixed) ;;
            *) echo "Invalid gas classification" >&2; exit 1 ;;
          esac
          while IFS= read -r label; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${label}"
          done < <(jq -r '.labels[].name | select(. == "gas:measured-improvement" or . == "gas:mixed") | @uri' <<< "$pr")
          if [[ -n "$GAS_LABEL" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=$GAS_LABEL"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Post gas report comment
        if: steps.current.outputs.publish == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gas-report
          path: gas-comment.md
