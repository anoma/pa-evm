[workspace]
resolver = "3"
members = [
  "crates/bindings",
  "crates/integration-test",
]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/pa-evm"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.2.0", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.36"
anoma-rm-risc0 = { version = "1.1.1", features = ["bonsai", "aggregation"] }
anyhow = "1.0"
dotenvy = { version = "0.15.7", features = ["cli"] }
hex = "0.4"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.26.1"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0"
thiserror = "2.0.19"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

anoma-pa-evm-bindings = { path = "crates/bindings" }
anoma-pa-evm-integration-test = { path = "crates/integration-test" }

# Backend-agnostic risc0 testkit, pinned by git rev (see anoma-pa-testkit
# ADR-0002). For cross-repo development, override locally with a `[patch]` to a
# path checkout.
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "3084189fe1941d3788d553d33bcf5e596e66efa8" }
anoma-risc0-verifier-bindings = "1.2.0"
