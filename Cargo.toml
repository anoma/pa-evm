[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/pa-evm"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.4.1", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.36"
anoma-pa-testkit = "1.0.0-rc.2"
anoma-risc0-verifier-bindings = "1.2.4"
anoma-rm-risc0 = { version = "2.0.0-rc.7", features = ["bonsai", "aggregation"] }
anyhow = "1.0.104"
dotenvy = { version = "0.15.7", features = ["cli"] }
hex = "0.4.3"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.26.1"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

anoma-pa-evm-bindings = { path = "crates/bindings" }
anoma-pa-evm-integration-test = { path = "crates/integration-test" }

[patch.crates-io]
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "a53d41063edb77d97e924920c3a28d9862b55670" }
anoma-rm-core = { git = "https://github.com/anoma/arm-risc0", rev = "ba22c6bd2ab101832e02fd71fd09a68bb350f3b4" }
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "ba22c6bd2ab101832e02fd71fd09a68bb350f3b4" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "ba22c6bd2ab101832e02fd71fd09a68bb350f3b4" }
