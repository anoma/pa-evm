[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/pa-evm"
homepage = "https://anoma.net/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.39"
anoma-pa-testkit = "1.0.0-rc.7"
anoma-risc0-verifier-bindings = "1.2.5"
anoma-rm-risc0 = { version = "2.0.0-rc.8.2", features = ["bonsai", "aggregation"] }
anyhow = "1.0.104"
dotenvy = { version = "0.15.7", features = ["cli"] }
hex = "0.4.3"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.28.0"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

anoma-pa-evm-bindings = { path = "crates/bindings" }
anoma-pa-evm-integration-test = { path = "crates/integration-test" }
