[package]
name = "anoma-pa-evm-integration-test"
description = "Integration and e2e tests for the Anoma EVM protocol adapter."
version = "0.1.0"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
edition.workspace = true
publish = false

[features]
default = ["local"]
local = ["anoma-pa-testkit/local"]
e2e = ["anoma-pa-testkit/e2e", "dep:dotenvy"]

[dependencies]
anoma-pa-testkit = { workspace = true, features = ["fixtures", "abi_encoding"] }
anoma-pa-evm-bindings = { workspace = true }
anoma-risc0-verifier-bindings = { workspace = true }

alloy = { workspace = true, features = ["json", "signer-local", "sol-types"] }
alloy-chains = { workspace = true }
anoma-rm-risc0 = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true, optional = true }
hex = { workspace = true }
risc0-zkvm = { workspace = true }

[dev-dependencies]
anoma-pa-testkit = { workspace = true, features = ["fixtures", "mocks", "abi_encoding"] }
regex = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
